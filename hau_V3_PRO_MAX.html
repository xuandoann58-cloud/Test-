<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Download Hub</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        :root{
            --bg:#05070a;
            --txt:#f4f7f5;
            --txt-2:#a9b3bd;
            --txt-3:#68737d;
            --gold:#ffd60a;
            --gold-2:#f5b301;
            --mint:#7df9d6;
            --green:#22c55e;
            --bd:rgba(255,255,255,.09);
            --bd-hi:rgba(255,255,255,.2);
            --glass:rgba(255,255,255,.04);
            --glass-2:rgba(255,255,255,.07);
            --r:20px;
            --ease:cubic-bezier(.32,.72,0,1);
        }
        html{scroll-behavior:smooth}
        body{
            font-family:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;
            background:var(--bg);
            color:var(--txt);
            min-height:100vh;
            line-height:1.6;
            -webkit-font-smoothing:antialiased;
            overflow-x:hidden;
            background-image:
                radial-gradient(ellipse 60% 50% at 15% 0%, rgba(125,249,214,.06), transparent 60%),
                radial-gradient(ellipse 50% 45% at 85% 100%, rgba(255,214,10,.05), transparent 60%);
            background-attachment:fixed;
        }
        a{text-decoration:none;color:inherit}
        ::-webkit-scrollbar{width:8px}
        ::-webkit-scrollbar-track{background:var(--bg)}
        ::-webkit-scrollbar-thumb{background:var(--bd);border-radius:4px}
        ::-webkit-scrollbar-thumb:hover{background:var(--gold)}

        .glass{
            position:relative;
            background:linear-gradient(180deg,rgba(255,255,255,.06),rgba(255,255,255,.02));
            border:1px solid var(--bd);
            border-radius:var(--r);
            box-shadow:
                0 1px 0 rgba(255,255,255,.12) inset,
                0 -1px 0 rgba(0,0,0,.25) inset,
                0 8px 28px rgba(0,0,0,.35);
        }

        .header{
            position:sticky;top:0;z-index:100;
            padding:12px 22px;
            display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;
            background:rgba(10,14,21,.7);
            backdrop-filter:blur(14px);
            -webkit-backdrop-filter:blur(14px);
            border-bottom:1px solid var(--bd);
        }
        .header-left{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
        .logo{
            font-size:21px;font-weight:900;letter-spacing:-.6px;
            color:var(--txt);display:flex;align-items:center;gap:8px;
        }
        .logo i{color:var(--mint)}
        .logo span{
            background:linear-gradient(135deg,var(--gold),var(--mint));
            -webkit-background-clip:text;-webkit-text-fill-color:transparent;
            background-clip:text;
        }
        .header-right{display:flex;align-items:center;gap:9px;flex-wrap:wrap}

        .gbtn{
            position:relative;
            padding:9px 18px;border-radius:14px;
            font-weight:700;font-size:13px;
            border:1px solid var(--bd);
            cursor:pointer;
            display:inline-flex;align-items:center;gap:7px;
            color:var(--txt);
            background:linear-gradient(180deg,rgba(255,255,255,.07),rgba(255,255,255,.02));
            box-shadow:
                0 1px 0 rgba(255,255,255,.14) inset,
                0 -1px 0 rgba(0,0,0,.2) inset,
                0 3px 12px rgba(0,0,0,.25);
            transition:transform .2s var(--ease), border-color .2s, box-shadow .2s, background .2s;
            will-change:transform;
        }
        .gbtn:hover{
            transform:translateY(-2px);
            border-color:var(--bd-hi);
            background:linear-gradient(180deg,rgba(255,255,255,.1),rgba(255,255,255,.03));
            box-shadow:
                0 1px 0 rgba(255,255,255,.2) inset,
                0 -1px 0 rgba(0,0,0,.2) inset,
                0 6px 20px rgba(0,0,0,.35);
        }
        .gbtn:active{transform:translateY(0) scale(.97)}
        .btn-social.youtube i{color:var(--gold)}
        .btn-social.telegram i{color:var(--mint)}
        .btn-bypass i{color:var(--green)}
        .btn-social.youtube:hover{border-color:rgba(255,214,10,.5)}
        .btn-social.telegram:hover{border-color:rgba(125,249,214,.5)}
        .btn-bypass:hover{border-color:rgba(34,197,94,.5)}

        .container{max-width:980px;margin:0 auto;padding:24px 20px 70px}

        .guide-line{
            text-align:center;color:var(--txt-2);margin-bottom:22px;font-size:14px;
            padding:13px 22px;border-radius:16px;
            background:linear-gradient(180deg,rgba(255,255,255,.05),rgba(255,255,255,.015));
            border:1px solid var(--bd);
            box-shadow:0 1px 0 rgba(255,255,255,.1) inset;
        }
        .guide-line strong{
            color:var(--gold);padding:3px 10px;border-radius:8px;
            background:rgba(255,214,10,.1);
            border:1px solid rgba(255,214,10,.25);
        }

        .admin-panel{
            padding:26px;
            margin-bottom:26px;
            display:none;
        }
        .admin-panel.active{display:block;animation:slideDown .3s var(--ease)}
        @keyframes slideDown{from{opacity:0;transform:translateY(-10px)}to{opacity:1;transform:translateY(0)}}
        .admin-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;flex-wrap:wrap;gap:10px}
        .admin-header h2{font-size:17px;font-weight:800;display:flex;align-items:center;gap:10px;letter-spacing:-.2px}
        .admin-header h2 i{color:var(--mint)}
        .admin-badge{
            font-size:10px;font-weight:800;letter-spacing:1px;
            padding:5px 13px;border-radius:20px;text-transform:uppercase;
            background:rgba(125,249,214,.1);color:var(--mint);
            border:1px solid rgba(125,249,214,.28);
            display:flex;align-items:center;gap:5px;
        }
        .form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
        .form-grid .full-width{grid-column:1/-1}
        .form-group label{
            display:block;font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:.6px;
            color:var(--txt-2);margin-bottom:6px;
        }
        .form-group input,.form-group textarea{
            width:100%;padding:12px 15px;
            background:rgba(0,0,0,.35);
            border:1px solid var(--bd);
            border-radius:12px;color:var(--txt);font-size:14px;
            transition:border-color .2s, box-shadow .2s;
            font-family:inherit;
        }
        .form-group input:focus,.form-group textarea:focus{
            outline:none;border-color:rgba(125,249,214,.55);
            box-shadow:0 0 0 3px rgba(125,249,214,.12);
        }
        .form-group textarea{resize:vertical;min-height:90px}
        .form-actions{display:flex;gap:10px;margin-top:18px;flex-wrap:wrap}

        .btn-primary{
            padding:12px 28px;border-radius:14px;
            font-weight:800;font-size:13.5px;
            border:1px solid rgba(255,214,10,.5);
            background:linear-gradient(180deg,#ffd60a,#f5b301);
            color:#0a0d0a;cursor:pointer;
            display:inline-flex;align-items:center;gap:8px;
            box-shadow:
                0 1px 0 rgba(255,255,255,.5) inset,
                0 -2px 0 rgba(0,0,0,.15) inset,
                0 4px 16px rgba(255,214,10,.25);
            transition:transform .2s var(--ease), box-shadow .2s, filter .2s;
            will-change:transform;
        }
        .btn-primary:hover{transform:translateY(-2px);filter:brightness(1.06);box-shadow:0 1px 0 rgba(255,255,255,.5) inset,0 -2px 0 rgba(0,0,0,.15) inset,0 8px 22px rgba(255,214,10,.35)}
        .btn-primary:active{transform:translateY(0) scale(.97)}

        .btn-secondary{
            padding:12px 28px;border-radius:14px;
            font-weight:700;font-size:13.5px;
            border:1px solid var(--bd);
            background:var(--glass);
            color:var(--txt-2);cursor:pointer;
            display:none;align-items:center;gap:8px;
            transition:all .2s var(--ease);
        }
        .btn-secondary:hover{background:var(--glass-2);color:var(--txt);border-color:var(--bd-hi)}
        .btn-secondary.active{display:inline-flex}

        .posts-grid{display:grid;grid-template-columns:1fr;gap:20px}
        .post-card{
            padding:24px 26px;
            transition:transform .25s var(--ease), border-color .25s, box-shadow .25s;
            will-change:transform;
        }
        .post-card:hover{
            transform:translateY(-4px);
            border-color:var(--bd-hi);
            box-shadow:
                0 1px 0 rgba(255,255,255,.16) inset,
                0 -1px 0 rgba(0,0,0,.25) inset,
                0 14px 36px rgba(0,0,0,.45);
        }
        .post-card .post-title{
            font-size:18px;font-weight:800;letter-spacing:-.3px;
            color:var(--txt);margin-bottom:8px;
            display:flex;align-items:center;gap:10px;flex-wrap:wrap;
        }
        .post-card .post-title .post-id{
            font-size:11px;font-weight:700;
            color:var(--gold);
            background:rgba(255,214,10,.1);
            padding:3px 10px;border-radius:12px;
            border:1px solid rgba(255,214,10,.25);
        }
        .post-card .post-image{
            width:100%;max-height:320px;object-fit:cover;
            border-radius:14px;margin:14px 0;
            border:1px solid var(--bd);
        }
        .post-card .post-desc{display:none}
        .post-card .post-meta{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-top:6px}

        .btn-download{
            padding:11px 24px;border-radius:14px;
            font-weight:800;font-size:13.5px;
            border:1px solid rgba(125,249,214,.45);
            background:linear-gradient(180deg,#7df9d6,#22c55e);
            color:#052e12;cursor:pointer;
            display:inline-flex;align-items:center;gap:9px;
            box-shadow:
                0 1px 0 rgba(255,255,255,.5) inset,
                0 -2px 0 rgba(0,0,0,.12) inset,
                0 4px 16px rgba(125,249,214,.25);
            transition:transform .2s var(--ease), box-shadow .2s, filter .2s;
            will-change:transform;
        }
        .btn-download:hover{transform:translateY(-2px);filter:brightness(1.05);box-shadow:0 1px 0 rgba(255,255,255,.5) inset,0 -2px 0 rgba(0,0,0,.12) inset,0 8px 22px rgba(125,249,214,.35)}
        .btn-download:active{transform:translateY(0) scale(.97)}

        .post-actions{display:flex;gap:9px;margin-top:16px;padding-top:16px;border-top:1px solid var(--bd)}
        .btn-edit,.btn-delete{
            padding:7px 15px;border-radius:10px;font-weight:700;font-size:12.5px;
            cursor:pointer;transition:all .2s var(--ease);display:none;align-items:center;gap:6px;
            border:1px solid var(--bd);background:var(--glass);
        }
        .btn-edit{color:var(--gold)}
        .btn-edit:hover{background:rgba(255,214,10,.12);border-color:rgba(255,214,10,.4)}
        .btn-delete{color:var(--txt-2)}
        .btn-delete:hover{background:var(--glass-2);color:var(--txt);border-color:var(--bd-hi)}
        .btn-edit.active,.btn-delete.active{display:inline-flex}

        .modal-overlay{
            position:fixed;inset:0;background:rgba(0,0,0,.8);
            z-index:9999;display:none;align-items:center;justify-content:center;padding:20px;
        }
        .modal-overlay.active{display:flex;animation:fadeIn .2s ease}
        @keyframes fadeIn{from{opacity:0}to{opacity:1}}
        .modal-box{
            position:relative;
            background:linear-gradient(180deg,rgba(28,34,42,.98),rgba(18,22,28,.98));
            border:1px solid var(--bd-hi);
            border-radius:24px;
            padding:30px;max-width:720px;width:100%;max-height:85vh;overflow-y:auto;
            box-shadow:
                0 1px 0 rgba(255,255,255,.18) inset,
                0 -1px 0 rgba(0,0,0,.3) inset,
                0 30px 80px rgba(0,0,0,.75);
            animation:popIn .3s var(--ease);
        }
        @keyframes popIn{from{opacity:0;transform:translateY(20px) scale(.97)}to{opacity:1;transform:translateY(0) scale(1)}}
        .modal-close{
            position:absolute;top:14px;right:16px;
            width:38px;height:38px;border-radius:12px;
            background:var(--glass);border:1px solid var(--bd);
            color:var(--txt-2);font-size:17px;cursor:pointer;
            transition:all .25s var(--ease);
            display:flex;align-items:center;justify-content:center;
        }
        .modal-close:hover{color:var(--mint);border-color:rgba(125,249,214,.5);transform:rotate(90deg)}
        .modal-title{
            font-size:20px;font-weight:800;letter-spacing:-.3px;
            color:var(--txt);margin-bottom:18px;padding-right:50px;
            padding-bottom:14px;border-bottom:1px solid var(--bd);
        }
        .modal-content{color:var(--txt-2);font-size:14.5px;line-height:1.85;white-space:pre-wrap;word-break:break-word}
        .modal-content a{
            color:var(--mint);text-decoration:none;font-weight:700;
            border-bottom:1px dashed rgba(125,249,214,.4);
            word-break:break-all;
        }
        .modal-content a:hover{color:var(--gold);border-bottom-color:var(--gold)}
        .modal-actions{margin-top:24px;display:flex;justify-content:center;border-top:1px solid var(--bd);padding-top:20px}
        .modal-download-btn{
            padding:14px 40px;border-radius:16px;
            font-weight:900;font-size:15px;
            border:1px solid rgba(125,249,214,.45);
            background:linear-gradient(180deg,#7df9d6,#22c55e);
            color:#052e12;cursor:pointer;
            display:inline-flex;align-items:center;gap:9px;
            box-shadow:
                0 1px 0 rgba(255,255,255,.5) inset,
                0 -2px 0 rgba(0,0,0,.12) inset,
                0 6px 20px rgba(125,249,214,.3);
            transition:all .25s var(--ease);will-change:transform;
        }
        .modal-download-btn:hover{transform:translateY(-3px);filter:brightness(1.06);box-shadow:0 1px 0 rgba(255,255,255,.5) inset,0 -2px 0 rgba(0,0,0,.12) inset,0 12px 32px rgba(125,249,214,.45)}

        .footer-admin{
            max-width:980px;margin:36px auto 0;padding:24px 26px;
            text-align:center;
        }
        .footer-admin h3{
            font-size:12.5px;font-weight:800;text-transform:uppercase;letter-spacing:1.6px;
            color:var(--txt-2);margin-bottom:16px;
            display:flex;align-items:center;justify-content:center;gap:9px;
        }
        .footer-admin h3 i{color:var(--mint)}
        .footer-admin .login-area{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;align-items:center}
        .footer-admin .login-area input{
            padding:12px 18px;background:rgba(0,0,0,.35);
            border:1px solid var(--bd);border-radius:12px;color:var(--txt);
            font-size:14px;min-width:220px;font-family:inherit;
            transition:border-color .2s, box-shadow .2s;
        }
        .footer-admin .login-area input:focus{
            outline:none;border-color:rgba(125,249,214,.55);
            box-shadow:0 0 0 3px rgba(125,249,214,.12);
        }
        .footer-admin .login-area .btn-login{
            padding:12px 28px;border-radius:14px;
            font-weight:800;font-size:13.5px;
            border:1px solid rgba(255,214,10,.5);
            background:linear-gradient(180deg,#ffd60a,#f5b301);
            color:#0a0d0a;cursor:pointer;
            display:inline-flex;align-items:center;gap:8px;
            box-shadow:0 1px 0 rgba(255,255,255,.5) inset,0 4px 16px rgba(255,214,10,.25);
            transition:all .2s var(--ease);will-change:transform;
        }
        .footer-admin .login-area .btn-login:hover{transform:translateY(-2px);filter:brightness(1.06)}
        .footer-admin .logout-area{display:none}
        .footer-admin .logout-area.active{display:block;animation:fadeIn .25s ease}
        .footer-admin .logout-area p{color:var(--mint);font-weight:700;margin-bottom:12px}
        .footer-admin .logout-area .btn-logout{
            padding:12px 28px;border-radius:14px;
            font-weight:800;font-size:13.5px;
            border:1px solid var(--bd);
            background:var(--glass);color:var(--txt-2);cursor:pointer;
            transition:all .2s var(--ease);
        }
        .footer-admin .logout-area .btn-logout:hover{background:var(--glass-2);color:var(--txt);border-color:var(--bd-hi);transform:translateY(-2px)}

        .empty-state{text-align:center;padding:60px 20px;color:var(--txt-3)}
        .empty-state i{font-size:48px;margin-bottom:16px;display:block;color:rgba(125,249,214,.3)}
        .empty-state h3{font-size:17px;color:var(--txt-2);margin-bottom:6px;font-weight:700}
    .hero-v3{margin-bottom:24px;border-radius:24px;overflow:hidden;position:relative;background:linear-gradient(135deg,#07111f,#172554,#0ea5e9);border:2px solid #22d3ee;box-shadow:0 0 30px rgba(34,211,238,.35)}.hero-v3 img{width:100%;height:260px;object-fit:cover;display:block;filter:brightness(.65)}.hero-v3 .overlay{position:absolute;inset:0;background:linear-gradient(to top,rgba(0,0,0,.8),rgba(0,0,0,.2))}.hero-v3 .content{position:absolute;left:20px;bottom:20px}.hero-v3 h1{font-size:30px;color:#6ee7ff;margin:0 0 6px}.hero-v3 p{margin:0;color:#fff;font-weight:700}.search-box{margin:18px 0}.search-box input{width:100%;padding:14px;border-radius:16px;background:#09131f;border:1px solid #22d3ee;color:#fff}.device-badge{display:inline-block;margin-top:8px;padding:5px 12px;border-radius:20px;background:#22d3ee;color:#001018;font-size:12px;font-weight:bold}</style>
</head>

        const BIN_ID = '67d130328a38f30733d2cf57';
        const API_KEY = '$2a$10$C823jQZqE8fIsR5G/4S33.Kz8B321Ivh4.7dZkS6B58M3J2.7S.tS';
        const ADMIN_PASS = 'alo1234vc';

        let postsData = [];
        let isAdmin = false;

        async function fetchPosts() {
            try {
                const res = await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}/latest`, {
                    headers: { 'X-Master-Key': API_KEY }
                });
                const data = await res.json();
                postsData = data.record.posts || [];
                renderPosts();
            } catch (err) {
                console.error("Lỗi tải dữ liệu:", err);
            }
        }

        async function savePosts() {
            try {
                await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}`, {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-Master-Key': API_KEY
                    },
                    body: JSON.stringify({ posts: postsData })
                });
                renderPosts();
            } catch (err) {
                alert("Lỗi lưu dữ liệu!");
            }
        }

        function renderPosts() {
            const listEl = document.getElementById('postsList');
            if (postsData.length === 0) {
                listEl.innerHTML = `
                    <div class="empty-state">
                        <i class="fa-solid fa-folder-open"></i>
                        <h3>Chưa có bài viết nào</h3>
                        <p>Danh sách hiện đang trống.</p>
                    </div>`;
                return;
            }

            listEl.innerHTML = postsData.map((post, index) => `
                <div class="glass post-card">
                    <div class="post-title">
                        <span>${escapeHtml(post.title)}</span>
                        <span class="post-id">#${index + 1}</span>
                    </div>
                    ${post.image ? `<img src="${escapeHtml(post.image)}" class="post-image" alt="${escapeHtml(post.title)}">` : ''}
                    <div class="device-badge">ANDROID / IOS / PC</div><div class="post-meta">
                        <button class="btn-download" onclick="openModal(${index})"><i class="fa-solid fa-download"></i> TẢI VỀ</button>
                    </div>
                    <div class="post-actions">
                        <button class="btn-edit ${isAdmin ? 'active' : ''}" onclick="editPost(${index})"><i class="fa-solid fa-pen"></i> Sửa</button>
                        <button class="btn-delete ${isAdmin ? 'active' : ''}" onclick="deletePost(${index})"><i class="fa-solid fa-trash"></i> Xóa</button>
                    </div>
                </div>
            `).join('');
        }

        function openModal(index) {
            const post = postsData[index];
            document.getElementById('modalTitle').innerText = post.title;
            document.getElementById('modalContent').innerText = post.desc || 'Không có mô tả thêm.';
            document.getElementById('modalDownloadBtn').href = post.link;
            document.getElementById('detailModal').classList.add('active');
        }

        function closeModal() {
            document.getElementById('detailModal').classList.remove('active');
        }

        function loginAdmin() {
            const pass = document.getElementById('adminPassInput').value;
            if (pass === ADMIN_PASS) {
                isAdmin = true;
                document.getElementById('adminPanel').classList.add('active');
                document.getElementById('loginArea').style.display = 'none';
                document.getElementById('logoutArea').classList.add('active');
                renderPosts();
            } else {
                alert('Sai mật khẩu!');
            }
        }

        function logoutAdmin() {
            isAdmin = false;
            document.getElementById('adminPanel').classList.remove('active');
            document.getElementById('loginArea').style.display = 'flex';
            document.getElementById('logoutArea').classList.remove('active');
            document.getElementById('adminPassInput').value = '';
            renderPosts();
        }

        document.getElementById('postForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const editIdx = parseInt(document.getElementById('editIndex').value);
            const title = document.getElementById('postTitle').value;
            const image = document.getElementById('postImage').value;
            const desc = document.getElementById('postDesc').value;
            const link = document.getElementById('postLink').value;

            const newPost = { title, image, desc, link };

            if (editIdx >= 0) {
                postsData[editIdx] = newPost;
            } else {
                postsData.unshift(newPost);
            }

            await savePosts();
            resetForm();
        });

        function editPost(index) {
            const post = postsData[index];
            document.getElementById('editIndex').value = index;
            document.getElementById('postTitle').value = post.title;
            document.getElementById('postImage').value = post.image;
            document.getElementById('postDesc').value = post.desc || '';
            document.getElementById('postLink').value = post.link;

            document.getElementById('btnSubmitForm').innerHTML = '<i class="fa-solid fa-check"></i> Cập Nhật Bài';
            document.getElementById('btnCancelEdit').classList.add('active');
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function resetForm() {
            document.getElementById('editIndex').value = -1;
            document.getElementById('postForm').reset();
            document.getElementById('btnSubmitForm').innerHTML = '<i class="fa-solid fa-plus"></i> Đăng Bài';
            document.getElementById('btnCancelEdit').classList.remove('active');
        }

        async function deletePost(index) {
            if (confirm("Bạn có chắc chắn muốn xóa bài viết này?")) {
                postsData.splice(index, 1);
                await savePosts();
            }
        }

        function escapeHtml(str) {
            return String(str).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
        }

        window.onload = fetchPosts;
    document.getElementById("searchInput")?.addEventListener("input",e=>{const k=e.target.value.toLowerCase();document.querySelectorAll(".post-card").forEach(card=>{card.style.display=card.innerText.toLowerCase().includes(k)?"block":"none";});});</script>
</body>
</html>
